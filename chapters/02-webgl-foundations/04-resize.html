<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 WebGL Resize</title>
<style>html,body{margin:0;height:100%;background:#080b14;color:#fff;font:16px system-ui}canvas{display:block;width:100%;height:100%}p{position:fixed;left:1rem;top:.5rem;background:#0009;padding:.5rem}</style></head>
<body><p id="readout">04 — resize the drawing buffer</p><canvas id="gl-canvas"></canvas>
<script>
const canvas=document.querySelector('#gl-canvas'), gl=canvas.getContext('webgl');if(!gl)throw Error('WebGL unavailable');
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.floor(canvas.clientWidth*dpr),h=Math.floor(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight);document.querySelector('#readout').textContent=`04 — CSS ${canvas.clientWidth}×${canvas.clientHeight}; buffer ${canvas.width}×${canvas.height}`;}
function draw(){resize();gl.clearColor(0.05,0.35,0.2,1);gl.clear(gl.COLOR_BUFFER_BIT);requestAnimationFrame(draw);}draw();
</script></body></html>
