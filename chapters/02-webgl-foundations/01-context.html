<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 WebGL Context</title>
<style>html,body{margin:0;height:100%;background:#111;color:#fff;font:16px system-ui}canvas{display:block;width:100%;height:100%}p{position:fixed;left:1rem;top:.5rem;background:#0009;padding:.5rem}</style></head>
<body><p>01 — canvas + WebGL context</p><canvas id="gl-canvas" aria-label="WebGL color canvas"></canvas>
<script>
const canvas = document.querySelector('#gl-canvas');
const gl = canvas.getContext('webgl');
if (!gl) throw new Error('WebGL is unavailable in this browser or GPU configuration.');
gl.clearColor(0.04, 0.18, 0.32, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);
</script></body></html>
