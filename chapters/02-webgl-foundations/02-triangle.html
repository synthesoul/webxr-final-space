<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 WebGL Triangle</title>
<style>html,body{margin:0;height:100%;background:#080b14;color:#fff;font:16px system-ui}canvas{display:block;width:100%;height:100%}p{position:fixed;left:1rem;top:.5rem;background:#0009;padding:.5rem}</style></head>
<body><p>02 — vertex + fragment shaders</p><canvas id="gl-canvas"></canvas>
<script>
const canvas = document.querySelector('#gl-canvas');
const gl = canvas.getContext('webgl');
if (!gl) throw new Error('WebGL unavailable');
const vertexSource = `attribute vec2 a_position; void main() { gl_Position = vec4(a_position, 0.0, 1.0); }`;
const fragmentSource = `precision mediump float; void main() { gl_FragColor = vec4(0.15, 0.8, 1.0, 1.0); }`;
function makeShader(type, source) {
  const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, makeShader(gl.VERTEX_SHADER, vertexSource));
gl.attachShader(program, makeShader(gl.FRAGMENT_SHADER, fragmentSource));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const position = gl.getAttribLocation(program, 'a_position');
const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.7, -0.6, 0.7, -0.6, 0.0, 0.7]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(position); gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
gl.clearColor(0.02, 0.03, 0.08, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3);
</script></body></html>
