<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>05 WebGL Primitive Modes</title>
<style>html,body{margin:0;height:100%;background:#080b14;color:#fff;font:16px system-ui}canvas{display:block;width:100%;height:100%}p{position:fixed;left:1rem;top:.5rem;background:#0009;padding:.5rem}</style></head>
<body><p>05 — primitive mode: <select id="mode"><option value="TRIANGLES">TRIANGLES</option><option value="TRIANGLE_STRIP">TRIANGLE_STRIP</option><option value="LINE_LOOP">LINE_LOOP</option></select></p><canvas id="gl-canvas"></canvas>
<script>
const canvas=document.querySelector('#gl-canvas'),gl=canvas.getContext('webgl');if(!gl)throw Error('WebGL unavailable');
const vs=`attribute vec2 a_position;void main(){gl_Position=vec4(a_position,0,1);}`,fs=`precision mediump float;void main(){gl_FragColor=vec4(0.95,0.45,0.15,1);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x;}
const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-0.65,0.65,0.65,0.65,-0.65,-0.65,0.65,-0.65]),gl.STATIC_DRAW);const a=gl.getAttribLocation(p,'a_position');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
const modes={TRIANGLES:gl.TRIANGLES,TRIANGLE_STRIP:gl.TRIANGLE_STRIP,LINE_LOOP:gl.LINE_LOOP};function draw(){gl.clearColor(0.02,0.03,0.08,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(modes[document.querySelector('#mode').value],0,4);}document.querySelector('#mode').addEventListener('change',draw);draw();
</script></body></html>
