<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Frame Physics and Interaction</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-physics-system@v4.0.1/dist/aframe-physics-system.min.js"></script>
  <script src="./main.js" defer></script>
</head>
<body>
  <a-scene
    physics="debug: false; gravity: 0 -9.8 0; restitution: 0.65; friction: 0.08"
    background="color: #0f172a"
    renderer="colorManagement: true; antialias: true"
    xr-mode-ui="XRMode: xr">

    <a-assets>
      <a-mixin id="controller-mixin"
        laser-controls
        cursor="rayOrigin: entity; fuse: false"
        raycaster="objects: .interactive; far: 12"></a-mixin>
    </a-assets>

    <a-entity camera position="0 1.6 4" look-controls>
      <a-cursor rayOrigin="mouse" fuse="false" color="#7dd3fc"></a-cursor>
    </a-entity>
    <a-entity mixin="controller-mixin" laser-controls="hand: left"></a-entity>
    <a-entity mixin="controller-mixin" laser-controls="hand: right"></a-entity>

    <a-entity light="type: ambient; color: #b8c7ff; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.5" position="-3 6 4"></a-entity>

    <a-plane static-body position="0 0 -4" rotation="-90 0 0" width="14" height="14"
      material="color: #334155; roughness: 0.9"></a-plane>
    <a-box static-body position="0 1 -6" width="5" height="2" depth="0.4" color="#475569"></a-box>

    <a-text value="CLICK / TRIGGER TO PUSH" align="center" color="#e0f2fe" width="5"
      position="0 3 -5.5"></a-text>

    <a-sphere class="interactive" position="-1.4 4 -5" radius="0.45" color="#f472b6"
      dynamic-body="shape: sphere; mass: 1" pushable></a-sphere>
    <a-box class="interactive" position="0 5 -5" width="0.8" height="0.8" depth="0.8"
      color="#38bdf8" dynamic-body="mass: 2" pushable></a-box>
    <a-cylinder class="interactive" position="1.4 6 -5" radius="0.45" height="1"
      color="#fbbf24" dynamic-body="shape: cylinder; mass: 1" pushable></a-cylinder>
  </a-scene>
</body>
</html>
